version: 2
updates:
  # GitHub Actions used by the workflows, one grouped PR per month.
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: "⬆️ ci(deps)"
    groups:
      github-actions:
        patterns: ["*"]

  # Gradle builds of all chapters. Only patch updates: the code is verified for
  # Spring Boot 4.0.x; minor and major upgrades are done on purpose, not by a bot.
  # Updates of the same dependency are combined into one PR for all chapters,
  # and the PR is merged only when the full CI (all chapters, end-to-end) passes.
  - package-ecosystem: gradle
    target-branch: develop
    commit-message:
      prefix: "⬆️ chore(deps)"
    directories:
      - "/Chapter03/1-spring-init"
      - "/Chapter03/2-basic-rest-services"
      - "/Chapter04"
      - "/Chapter05"
      - "/Chapter06"
      - "/Chapter07"
      - "/Chapter09"
      - "/Chapter10"
      - "/Chapter11"
      - "/Chapter12"
      - "/Chapter13"
      - "/Chapter14"
      - "/Chapter15"
      - "/Chapter16"
      - "/Chapter17"
      - "/Chapter18"
      - "/Chapter19"
      - "/Chapter20"
      - "/Chapter23"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      all-chapters:
        group-by: dependency-name
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
