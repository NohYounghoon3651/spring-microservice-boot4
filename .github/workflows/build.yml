name: Build all chapters (Spring Boot 4.0.9 / Java 21)

on:
  push:
    # release/* and hotfix/* are verified by their pull request into main (no duplicate push runs)
    branches: [main, develop]
    paths-ignore: ['**/*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**', '.github/workflows/wiki.yml', '.github/workflows/labeler.yml', '.github/workflows/codeql.yml', '.github/workflows/images.yml', '.github/workflows/devcontainer.yml', '.github/workflows/dependency-submission.yml', '.github/labeler.yml', '.github/dependabot.yml', '.devcontainer/**', 'tools/**']
  pull_request:
  schedule:
    - cron: '0 18 * * 0'   # every Monday 03:00 KST
  workflow_dispatch:

jobs:
  # Pull requests that only touch documentation skip the builds, but still report "CI result".
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "code=true" >> $GITHUB_OUTPUT; exit 0; fi
          files=$(git -c core.quotePath=false diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
          echo "$files"
          if echo "$files" | grep -vE '\.md$|^docs/|^\.github/ISSUE_TEMPLATE/|^\.github/workflows/(wiki|labeler|codeql|images|devcontainer|dependency-submission)\.yml$|^\.github/labeler\.yml$|^\.github/dependabot\.yml$|^\.devcontainer/|^tools/' | grep -q .; then
            echo "code=true" >> $GITHUB_OUTPUT
          else
            echo "code=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project:
          - Chapter03/1-spring-init
          - Chapter03/2-basic-rest-services
          - Chapter04
          - Chapter05
          - Chapter06
          - Chapter07
          - Chapter09
          - Chapter10
          - Chapter11
          - Chapter12
          - Chapter13
          - Chapter14
          - Chapter15
          - Chapter16
          - Chapter17
          - Chapter18
          - Chapter19
          - Chapter20
          - Chapter23
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # Tests use Testcontainers (MongoDB, MySQL); the ubuntu runner provides Docker.
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build --continue --no-daemon

      - name: Test summary
        if: always()
        shell: python
        run: |
          import glob, os, xml.etree.ElementTree as ET
          rows, tot = [], [0, 0, 0, 0]
          for f in sorted(glob.glob("**/build/test-results/test/*.xml", recursive=True)):
              s = ET.parse(f).getroot()
              t, fl, e, sk = (int(s.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
              mod = f.split("/build/")[0]
              rows.append(f"| {mod} | {s.get('name').split('.')[-1]} | {t} | {fl + e} | {sk} |")
              tot = [a + b for a, b in zip(tot, (t, fl, e, sk))]
          out = [f"### ${{ matrix.project }}: {tot[0]} tests, {tot[1] + tot[2]} failed, {tot[3]} skipped", "",
                 "| module | test class | tests | failed | skipped |", "|---|---|---|---|---|"] + rows
          print("\n".join(out))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(out) + "\n")

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ strategy.job-index }}
          path: |
            ${{ matrix.project }}/**/build/reports/tests/
            ${{ matrix.project }}/**/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The book's end-to-end test (test-em-all.bash) against the whole system started with Docker Compose.
  e2e:
    name: e2e ${{ matrix.project }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [Chapter04, Chapter05, Chapter06, Chapter07, Chapter09, Chapter10, Chapter11, Chapter12,
                  Chapter13, Chapter14, Chapter15, Chapter16, Chapter17, Chapter18, Chapter19, Chapter20, Chapter23]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build jars and Docker images
        run: |
          chmod +x gradlew test-em-all.bash
          ./gradlew build -x test --no-daemon
          docker compose build

      - name: Run test-em-all.bash
        run: |
          case "${{ matrix.project }}" in
            Chapter18|Chapter19|Chapter20|Chapter23)
              export HOST=localhost PORT=8443 HEALTH_URL=https://localhost:8443 USE_K8S=false ;;
          esac
          ./test-em-all.bash start stop

      - name: Warnings and errors in container logs
        if: always()
        run: |
          docker compose logs --no-color > compose.log 2>&1 || true
          echo "### ${{ matrix.project }}: WARN/ERROR lines in container logs" >> $GITHUB_STEP_SUMMARY
          grep -E " (WARN|ERROR) " compose.log | sed -E 's/^[^|]*\| *[0-9TZ:.+-]+ +//' | cut -c1-220 | sort | uniq -c | sort -rn | head -40 | tee -a $GITHUB_STEP_SUMMARY || true

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs-${{ strategy.job-index }}
          path: ${{ matrix.project }}/compose.log
          retention-days: 7

  e2e-chapter03:
    name: e2e Chapter03/2-basic-rest-services
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Chapter03/2-basic-rest-services
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, start the services and run test-em-all.bash
        run: |
          chmod +x gradlew test-em-all.bash
          ./gradlew build -x test --no-daemon
          for s in product recommendation review product-composite; do
            nohup java -jar microservices/$s-service/build/libs/*.jar > $s.log 2>&1 &
          done
          for p in 7001 7002 7003 7004; do
            for i in $(seq 1 60); do curl -s localhost:$p/actuator/health > /dev/null 2>&1 && break; nc -z localhost $p && break; sleep 2; done
          done
          ./test-em-all.bash
      - name: Service logs
        if: always()
        run: grep -hE " (WARN|ERROR) " *.log | cut -c1-220 | sort | uniq -c | sort -rn | head -40 || true

  # test-em-all.bash with the Kafka and the partitioned RabbitMQ setups.
  e2e-variants:
    name: e2e ${{ matrix.project }} ${{ matrix.compose }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [Chapter07, Chapter09, Chapter10, Chapter11, Chapter12, Chapter13, Chapter14,
                  Chapter15, Chapter16, Chapter17, Chapter18, Chapter19, Chapter20, Chapter23]
        compose: [docker-compose-kafka.yml, docker-compose-partitions.yml]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    env:
      COMPOSE_FILE: ${{ matrix.compose }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build jars and Docker images
        run: |
          chmod +x gradlew test-em-all.bash
          ./gradlew build -x test --no-daemon
          docker compose build
      - name: Run test-em-all.bash
        run: |
          case "${{ matrix.project }}" in
            Chapter18|Chapter19|Chapter20|Chapter23)
              export HOST=localhost PORT=8443 HEALTH_URL=https://localhost:8443 USE_K8S=false ;;
          esac
          ./test-em-all.bash start stop
      - name: Warnings and errors in container logs
        if: always()
        run: |
          docker compose logs --no-color > compose.log 2>&1 || true
          echo "### ${{ matrix.project }} ${{ matrix.compose }}: WARN/ERROR lines" >> $GITHUB_STEP_SUMMARY
          grep -E " (WARN|ERROR) " compose.log | sed -E 's/^[^|]*\| *[0-9TZ:.+-]+ +//' | cut -c1-220 | sort | uniq -c | sort -rn | head -40 | tee -a $GITHUB_STEP_SUMMARY || true

  # Chapter 23: native images built with Cloud Native Buildpacks (GraalVM 25), tested with test-em-all.bash.
  e2e-native:
    name: e2e Chapter23 native
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: Chapter23
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # The buildpack's own ~350 MB GraalVM download from GitHub releases often fails on hosted
      # runners, so download it here with retries and pass it in as a dependency-mapping binding.
      - name: Prefetch GraalVM for the buildpack
        run: bash ../tools/ci/prefetch-native-deps.sh "$RUNNER_TEMP/native-deps"
      - name: Build native images
        env:
          NIK_BINDING_DIR: ${{ runner.temp }}/native-deps
        run: |
          chmod +x gradlew test-em-all.bash
          ./gradlew build -x test --no-daemon
          for s in product recommendation review product-composite; do
            for attempt in 1 2 3; do
              ./gradlew --init-script ../tools/ci/native-binding.init.gradle \
                :microservices:$s-service:bootBuildImage --no-daemon && break
              [ $attempt = 3 ] && exit 1
              echo "::warning::bootBuildImage for $s failed (attempt $attempt), retrying"; sleep 30
            done
          done
          docker images | grep hands-on
      - name: Run test-em-all.bash (native)
        env:
          COMPOSE_FILE: docker-compose-native.yml
        run: |
          docker compose build
          HOST=localhost PORT=8443 HEALTH_URL=https://localhost:8443 USE_K8S=false ./test-em-all.bash start stop
      - name: Run test-em-all.bash (native, partitions)
        env:
          COMPOSE_FILE: docker-compose-partitions-native.yml
        run: |
          docker compose build
          HOST=localhost PORT=8443 HEALTH_URL=https://localhost:8443 USE_K8S=false ./test-em-all.bash start stop

      - name: Diagnostics (native product-composite actuator)
        if: failure()
        run: |
          for f in docker-compose-native.yml docker-compose-partitions-native.yml; do
            export COMPOSE_FILE=$f
            docker compose ps --services --status running | grep -q product-composite || continue
            echo "== $f: /actuator/health"
            docker compose exec -T auth-server wget -qO - http://product-composite:4004/actuator/health || true
            echo; echo "== $f: /actuator/circuitbreakerevents/product/STATE_TRANSITION"
            docker compose exec -T auth-server wget -qO - http://product-composite:4004/actuator/circuitbreakerevents/product/STATE_TRANSITION || true
            echo; echo "== $f: product-composite log"
            docker compose logs --no-color product-composite | grep -iE "circuit|resilience|health|actuator|exception|error" | head -60 || true
          done

      - name: Warnings and errors in container logs
        if: always()
        run: |
          for f in docker-compose-native.yml docker-compose-partitions-native.yml; do
            COMPOSE_FILE=$f docker compose logs --no-color >> compose.log 2>&1 || true
          done
          grep -E " (WARN|ERROR) " compose.log | sed -E 's/^[^|]*\| *[0-9TZ:.+-]+ +//' | cut -c1-220 | sort | uniq -c | sort -rn | head -40 | tee -a $GITHUB_STEP_SUMMARY || true

  # Single status to require in branch protection: fails if any job above did not succeed.
  # The generated wiki pages (docs/wiki) must match the code: regenerate them and compare.
  wiki:
    name: Wiki up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate docs/wiki with tools/wiki/learning.py
        run: |
          python3 tools/wiki/learning.py
          if ! git diff --quiet -- docs/wiki; then
            git -c core.quotePath=false diff --stat -- docs/wiki
            echo "::error::docs/wiki is out of date. Run 'python3 tools/wiki/learning.py' and commit the result."
            exit 1
          fi
      # Dependabot PRs change build files in every chapter; they cannot push the regenerated
      # workbook, so the check only warns there (see CONTRIBUTING.md, "워크북").
      - name: Regenerate workbook with tools/workbook/build.py
        continue-on-error: ${{ github.actor == 'dependabot[bot]' }}
        run: |
          python3 tools/workbook/build.py
          if ! git diff --quiet -- workbook; then
            git -c core.quotePath=false diff --stat -- workbook
            echo "::error::workbook is out of date. Run 'python3 tools/workbook/build.py' and commit the result."
            exit 1
          fi
      - name: Rebuild every chapter from the workbook alone
        run: python3 tools/workbook/verify.py

  ci-result:
    name: CI result
    if: always()
    needs: [changes, wiki, build, e2e, e2e-chapter03, e2e-variants, e2e-native]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # "skipped" is fine (documentation-only pull request), anything else must succeed
          if echo "$NEEDS" | jq -e '.changes.result != "success" or (to_entries | map(select(.value.result != "success" and .value.result != "skipped")) | length > 0)' > /dev/null; then
            echo "::error::Some jobs did not succeed"; exit 1
          fi
