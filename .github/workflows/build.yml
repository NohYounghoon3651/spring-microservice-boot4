name: Build all chapters (Spring Boot 4.0.9 / Java 21)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project:
          - Chapter03/1-spring-init
          - Chapter03/2-basic-rest-services
          - Chapter04
          - Chapter05
          - Chapter06
          - Chapter07
          - Chapter09
          - Chapter10
          - Chapter11
          - Chapter12
          - Chapter13
          - Chapter14
          - Chapter15
          - Chapter16
          - Chapter17
          - Chapter18
          - Chapter19
          - Chapter20
          - Chapter23
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Tests use Testcontainers (MongoDB, MySQL); the ubuntu runner provides Docker.
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build --continue --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ strategy.job-index }}
          path: |
            ${{ matrix.project }}/**/build/reports/tests/
            ${{ matrix.project }}/**/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
