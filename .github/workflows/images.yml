name: Publish container images

# Builds the Docker images of every chapter and publishes them to GitHub Container Registry,
# so learners can pull them instead of building, e.g.
#   docker pull ghcr.io/nohyounghoon3651/spring-microservice-boot4/ch13-product-service:latest   (or :<release version>)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag (default: latest)"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: images ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [Chapter04, Chapter05, Chapter06, Chapter07, Chapter09, Chapter10, Chapter11, Chapter12,
                  Chapter13, Chapter14, Chapter15, Chapter16, Chapter17, Chapter18, Chapter19, Chapter20, Chapter23]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.version || 'latest' }}
        run: |
          set -e
          VERSION=${VERSION#v}
          REPO=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          CH=$(echo "${{ matrix.project }}" | sed -E 's/Chapter/ch/')
          chmod +x gradlew
          ./gradlew build -x test --no-daemon
          docker compose build
          for img in $(docker compose config --images | grep '^hands-on/' | sort -u); do
            name=${img#hands-on/}; name=${name%%:*}
            for tag in "$VERSION" latest; do
              docker tag "$img" "$REPO/$CH-$name:$tag"
              docker push "$REPO/$CH-$name:$tag"
            done
            echo "- \`$REPO/$CH-$name:$VERSION\`" >> $GITHUB_STEP_SUMMARY
          done
